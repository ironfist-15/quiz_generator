<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Take or Create a Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        input, button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 10px;
            border: none;
            border-radius: 8px;
        }
        input {
            width: 250px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        label {
            margin-top: 10px;
        }
        .quiz-questions, .create-quiz-form {
            margin-top: 20px;
            display: none;
            flex-direction: column;
        }
        .question-container {
            margin-bottom: 15px;
        }
        .response-container {
            display: flex;
            flex-direction: column;
            margin-top: 10px;
        }
        .finals {
            font-weight: bold;
            font-size: 24px;
            text-align: center;
        }
        .create-quiz-button {
            display: block;
            margin: 20px auto;
        }
        .bold-text {
            font-weight: bold;
            font-size: 24px;
            margin: 20px auto;
        }
        #generatedQuizId {
            margin-top: 20px;
            font-weight: bold;
            color: blue;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- Create a new quiz form -->
<div class="create-quiz-form">
    <h2 class="finals">Create a Quiz</h2>
    <label for="quizCategory">Subject:</label>
    <input type="text" id="quizCategory" placeholder="Enter quiz subject" required>

    <label for="numQuestions">Number of Questions:</label>
    <input type="number" id="numQuestions" placeholder="Number of questions" required>

    <label for="quizTitle">Quiz Title:</label>
    <input type="text" id="quizTitle" placeholder="Enter quiz title" required>

    <button type="button" onclick="createQuiz()" class="create-quiz-button">Create Quiz</button>
</div>

<!-- Display the generated quiz ID -->
<div id="generatedQuizId"></div>

<!-- Enter quiz ID to attempt -->
<label for="quizId" class="bold-text">Enter Quiz ID to attempt:</label>
<input type="text" id="quizId" name="quizId" placeholder="Quiz ID" required>

<!-- Button to attempt quiz -->
<button type="button" onclick="attemptQuiz()">Attempt Quiz</button>

<!-- Quiz questions and options (Initially hidden) -->
<div id="quizQuestions" class="quiz-questions">
    <h2>Answer the following questions:</h2>
    <div id="questionsContainer"></div>

    <!-- Button to submit answers -->
    <button type="button" onclick="submitQuiz()">Submit</button>
</div>

<script>
    let questionsData = [];
    let quizId = "";

    // Function to create a quiz
    function createQuiz() {
        const category = document.getElementById('quizCategory').value;
        const numQuestions = document.getElementById('numQuestions').value;
        const title = document.getElementById('quizTitle').value;

        // Check if all fields are filled
        if (category && numQuestions && title) {
            fetch('/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `category=${category}&numq=${numQuestions}&title=${title}`
            })
            .then(response => response.json()) // Assuming the backend returns JSON { "id": quizId }
            .then(data => {
                if (data.id) {
                    // Display the generated quiz ID
                    document.getElementById('generatedQuizId').innerText = `Quiz created successfully! Your Quiz ID: ${data.id}`;
                    quizId = data.id; // Store the quiz ID for future use
                } else {
                    alert('Error: Quiz creation failed!');
                }
            })
            .catch(error => {
                alert("Error creating quiz: " + error);
            });
        } else {
            alert("Please fill in all fields.");
        }
    }

    // Function to attempt quiz
    function attemptQuiz() {
        quizId = document.getElementById('quizId').value;

        if (quizId) {
            fetch(`/quiz/${quizId}`)
                .then(response => response.json())
                .then(data => {
                    questionsData = data;
                    displayQuestions();
                })
                .catch(error => {
                    alert("Error fetching quiz questions.");
                });
        } else {
            alert("Please enter a valid Quiz ID.");
        }
    }

    // Function to display questions and options
    function displayQuestions() {
        const quizQuestionsDiv = document.getElementById("quizQuestions");
        const questionsContainer = document.getElementById("questionsContainer");
        questionsContainer.innerHTML = ""; // Clear previous questions

        questionsData.forEach((question, index) => {
            const questionDiv = document.createElement("div");
            questionDiv.classList.add("question-container");

            questionDiv.innerHTML = `
                <label>${question.question}</label>
                <div class="response-container">
                    <label><input type="radio" name="response${index}" value="${question.option1}">${question.option1}</label>
                    <label><input type="radio" name="response${index}" value="${question.option2}">${question.option2}</label>
                    <label><input type="radio" name="response${index}" value="${question.option3}">${question.option3}</label>
                    <label><input type="radio" name="response${index}" value="${question.option4}">${question.option4}</label>
                </div>
            `;

            questionsContainer.appendChild(questionDiv);
        });

        quizQuestionsDiv.style.display = "block";
    }

    // Function to submit quiz
    function submitQuiz() {
        const responses = [];

        // Collect all selected answers for the quiz
        questionsData.forEach((question, index) => {
            const selectedOption = document.querySelector(`input[name="response${index}"]:checked`);
            if (selectedOption) {
                responses.push({
                    id: question.id, // Include question ID
                    response: selectedOption.value // Send the actual answer text
                });
            } else {
                alert(`Please answer all questions.`);
                return;
            }
        });

        // Submit the responses to the server
        fetch(`/quiz/submit/${quizId}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(responses)
        })
        .then(response => response.json())
        .then(score => {
            alert(`Your score is: ${score}`);
        })
        .catch(error => {
            alert("Error submitting quiz.");
        });
    }

    // Display create quiz form by default
    document.querySelector('.create-quiz-form').style.display = "block";
</script>

</body>
</html>
